[workspace]
resolver = "2"
members = [
    "crates/splice-proto",
    "crates/splice-tailscale",
    "crates/splice-core",
    "crates/splice-platform",
    "crates/splice-daemon",
    "crates/splice-app",
    "crates/splice-update",
]

[workspace.package]
version = "1.2.0"
edition = "2021"
license = "MIT"

[workspace.dependencies]
# internal
splice-proto = { path = "crates/splice-proto" }
splice-tailscale = { path = "crates/splice-tailscale" }
splice-core = { path = "crates/splice-core" }
splice-platform = { path = "crates/splice-platform" }
splice-update = { path = "crates/splice-update" }

# shared
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
postcard = { version = "1", features = ["alloc", "use-std"] }
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
async-trait = "0.1"
futures = "0.3"
base64 = "0.22"
directories = "6"
keycode = "1"
parking_lot = "0.12"

# UI
eframe = "0.36"
egui = "0.36"

# Linux
ashpd = { version = "0.13", default-features = false, features = ["tokio"] }
reis = { version = "0.7", features = ["tokio"] }
evdev = { version = "0.13", features = ["tokio"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
ksni = "0.3"

# macOS
core-graphics = "0.25"
core-foundation = "0.10"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = "0.3"
tray-icon = { version = "0.24", default-features = false }

[profile.release]
lto = "thin"
strip = true
